name: Build Windows Installer

on:
  push:
    branches:
      - suyeong/frontend-dashboard
    paths:
      - frontend/**
      - ai_mouse_tauri/**
      - .github/workflows/build-windows-installer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ai_mouse_tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Tauri dependencies
        run: npm ci
        working-directory: ai_mouse_tauri

      - name: Build NSIS installer
        run: npm run build -- --bundles nsis
        working-directory: ai_mouse_tauri

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Hand-Windows-Installer
          path: ai_mouse_tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Commit installer to this branch
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'ai_mouse_tauri/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'NSIS installer was not created.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- $installer.FullName

          if (git diff --cached --quiet) {
            Write-Host 'Installer is already up to date.'
            exit 0
          }

          git commit -m 'Build Windows installer [skip ci]'
          git push origin HEAD:suyeong/frontend-dashboard
